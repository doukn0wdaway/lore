# lore configuration — see `lore help`.
root: lore                       # folder with the docs
main_branch: dev                 # base for `lore change new --from-diff`

# Decisions model: prompt hook, change status, fact checks at the gate.
# The key is lore's own, separate from the app's env: the variable below from the
# environment, lore/.env (this project, gitignored) or ~/.config/lore/.env (all projects).
decisions_model: perplexity/pplx-decider-v1.2
decisions_api_key_env: LORE_OPENROUTER_API_KEY
decisions_endpoint: https://openrouter.ai/api/alpha/decisions
decisions_provider: [Perplexity]  # provider order on OpenRouter, no fallbacks

hook:
  enabled: true                  # inject context on every prompt (needs the API key)
  min_words: 4                   # shorter prompts are not matched
  timeout_ms: 6000
  budget_tokens: 2500            # how much content to inject per prompt

thresholds:
  zones: 0.3                     # stage 1 of selection — low, never lose a zone
  include_content: 0.7           # above: inject the content
  include_pointer: 0.4           # above: inject a pointer
  contradiction: 0.5             # above: ask the owner at the gates

prompts:
  relates: lore/prompts/relates.txt
  contradicts: lore/prompts/contradicts.txt

# Paths `lore lint` skips when it checks `ADR <id>` anchors in code: files,
# folders or globs, relative to the project root; a pattern without a slash
# matches the file name anywhere (`*_test.go`), like .gitignore.
anchors_ignore:                  # lore's own docs and tests hold example anchors
  - design.md
  - internal/assets/files/workflows/audit/SKILL.md
  - internal/assets/files/workflows/bootstrap/SKILL.md
  - internal/lore/lore_test.go
